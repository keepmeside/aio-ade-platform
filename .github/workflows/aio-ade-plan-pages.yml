name: Publish aio-ade plan

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aio-ade-plan-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'github\.com/(keepmeside/aio-ade-platform|[^"[:space:]]+/(private|internal)[^"[:space:]]*)' plans/260730-0117-aio-ade-rebrand-and-integration/plan.html; then
            echo "Refusing to publish a private/internal GitHub URL"
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          cp plans/260730-0117-aio-ade-rebrand-and-integration/plan.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
