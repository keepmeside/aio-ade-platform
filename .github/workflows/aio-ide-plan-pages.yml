name: Publish Aio-IDE plan

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aio-ide-plan-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The guard script is stdlib-only, but pin the runtime anyway so a runner image change cannot
      # alter what the publication gate accepts.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          PLAN_HTML='plans/260730-0117-aio-ide-rebrand-and-integration/plan.html'
          # Why this check exists: `plans/` is internal operating history and is no longer tracked
          # (it is in .gitignore), so a fresh checkout does not contain it. Publishing the plan
          # therefore needs an explicit decision about how the artifact reaches CI — generate it
          # outside the repo, or allowlist this one file. That decision belongs to the
          # pre-publication gate, not to this workflow silently failing on a missing path.
          if [[ ! -f "$PLAN_HTML" ]]; then
            echo "::error::$PLAN_HTML is not in the checkout: plans/ is intentionally untracked." >&2
            echo "::error::Publishing it requires generating the artifact outside the repo or allowlisting this file." >&2
            exit 1
          fi
          # Content preconditions live in a tested script, not in a grep: the pre-flip version of this
          # check refused this repository's own URL, which is a valid public citation now that the repo
          # is public — and the plan's baseline table cites it, so the guard blocked every deploy.
          node config/scripts/plan-html-publish-guard.mjs "$PLAN_HTML"
          rm -rf _site
          mkdir -p _site
          cp "$PLAN_HTML" _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
