name: Publish Aio-IDE plan

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aio-ide-plan-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      # Pin the runtime so a runner image change cannot alter what the publication gate accepts.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      # The renderer needs `marked` for the GFM tables the plan is full of; everything else it uses
      # is stdlib. `--ignore-scripts` keeps a docs publish from building native modules it never runs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          PLAN_DIR='plans/260730-0117-aio-ide-rebrand-and-integration'
          PLAN_HTML="$RUNNER_TEMP/plan.html"
          # Generated here rather than committed: the previous artifact was hand-maintained and went
          # stale — it predated four phases and a brand change while still reading as current. Only
          # plan.md and phase-*.md are allowlisted out of plans/, and they are the whole input, so the
          # page cannot disagree with the plan. Everything else under plans/ stays internal.
          node config/scripts/render-plan-html.mjs "$PLAN_DIR" "$PLAN_HTML"
          # Content preconditions live in a tested script, not in a grep: the pre-flip version of this
          # check refused this repository's own URL, which is a valid public citation now that the repo
          # is public — and the plan's baseline table cites it, so the guard blocked every deploy.
          node config/scripts/plan-html-publish-guard.mjs "$PLAN_HTML"
          rm -rf _site
          mkdir -p _site
          cp "$PLAN_HTML" _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
